<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pai's portfolio</title>
    <link rel="stylesheet" href="3D_ani.css">
    <!-- CORRECTED URL -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>
    <div id="app-wrapper">
        <section id="introduction">
            <a href="index.html" class="Logo-container"><img id="welcome" src="./src/Logo_vector.png" alt="Welcome Image"></a>
            <h1 id="welcome">Web Development Journey and achievements</h1>
            <div class="timeline-wrapper">
                <div class="timeline-track">
                    <div class="timeline-progress" id="progress-line"></div>
                    <div class="timeline-dots">
                        <button class="dot active" data-index="0"></button>
                        <button class="dot" data-index="1"></button>
                        <button class="dot" data-index="2"></button>
                        <button class="dot" data-index="3"></button>
                        <button class="dot" data-index="4"></button>
                    </div>
                </div>

                <div class="timeline-content" id="content-display">
                    <h2 id="event-year">2014</h2>
                    <h3 id="event-title">Introduction to Web Development</h3>
                    <p id="event-desc">I started my journey in web development in 2014, with adobe dreamweaver, and, hosted my first website ever on 5GBfree.</p>
                    <img id="event-image" src="./src/Dreamweaver.jpg" alt="Web Development">
                </div>

                <div class="timeline-controls">
                    <button id="btn-play">Auto-Play Sequence</button>
                    <button id="btn-reset">Reset</button>
                </div>

            </div>
        </section>
        <section id="recent-projects">
            <h2 id="activities-heading">Recent Projects</h2>
            <p>Fire fighting robot development</p>
            <!-- This empty box is styled by your CSS and ready for the 3D model -->
            <model-viewer 
                id="canvas-container"
                src="./src/robot iteration 10 chassis.glb" 
                environment-image="neutral"
                shadow-intensity="1"
                camera-controls 
                auto-rotate
                ar
                environment-image="neutral"  
                exposure="0.5"               
                shadow-intensity="1"         
                shadow-softness="0.5">       
            </model-viewer>
        </section>
    </div>

    <script src="web_dev_JS.js"></script>
</body>
</html>
