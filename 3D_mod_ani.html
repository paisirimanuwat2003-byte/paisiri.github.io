<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pai's portfolio</title>
    <link rel="stylesheet" href="stylesheet.css">
    <!-- CORRECTED URL -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>
    <div id="app-wrapper">
        <section id="introduction">
            <h1 id="welcome">My 3D Modeling and Animation Journey</h1>
            <img id="profile-pic" src="./src/pfp.jpg" alt="Profile Picture">
            <p id="description">
            </p>
        </section>
        <section id="recent-projects">
            <h2 id="activities-heading">Recent Projects</h2>
            <p>Fire fighting robot development</p>
            <!-- This empty box is styled by your CSS and ready for the 3D model -->
            <model-viewer 
                id="canvas-container"
                src="./src/robot iteration 10 chassis.glb" 
                environment-image="neutral"
                shadow-intensity="1"
                camera-controls 
                auto-rotate
                ar
                environment-image="neutral"  
                exposure="0.5"               
                shadow-intensity="1"         
                shadow-softness="0.5">       
            </model-viewer>
        </section>
    </div>
</body>
</html>
